# Default values for todo-chatbot.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

frontend:
  image:
    repository: todo-frontend
    tag: latest
    pullPolicy: Never
  replicas: 2
  service:
    type: NodePort
    port: 3000
    nodePort: 30000
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
  env:
    NEXT_PUBLIC_API_URL: http://todo-backend:8000

backend:
  image:
    repository: todo-backend
    tag: latest
    pullPolicy: Never
  replicas: 2
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
  secretName: todo-secrets
