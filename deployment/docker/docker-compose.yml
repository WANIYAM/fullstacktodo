version: '3.8'

services:
  frontend:
    build:
      context: ../../
      dockerfile: ./deployment/docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../../.env
    depends_on:
      - backend

  backend:
    build:
      context: ../../
      dockerfile: ./deployment/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
